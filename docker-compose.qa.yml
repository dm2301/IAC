services:
  web-qa:
    image: nginx:1.27-alpine
    container_name: web-qa
    ports:
      - "5001:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - red-qa

  api-qa:
    image: node:20-alpine
    container_name: api-qa
    ports:
      - "5002:3000"
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_HOST: bd-qa
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PORT: 3000
    command: sh -c "npm install --omit=dev && node index.js"
    depends_on:
      - bd-qa
    networks:
      - red-qa

  bd-qa:
    image: postgres:16-alpine
    container_name: bd-qa
    ports:
      - "5003:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - datos-qa:/var/lib/postgresql/data
    networks:
      - red-qa

networks:
  red-qa:
    name: red-qa

volumes:
  datos-qa:
    name: datos-qa
