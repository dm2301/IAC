services:
  web-dev:
    image: nginx:1.27-alpine
    container_name: web-dev
    ports:
      - "4001:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - red-dev

  api-dev:
    image: node:20-alpine
    container_name: api-dev
    ports:
      - "4002:3000"
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_HOST: bd-dev
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PORT: 3000
    command: sh -c "npm install --omit=dev && node index.js"
    depends_on:
      - bd-dev
    networks:
      - red-dev

  bd-dev:
    image: postgres:16-alpine
    container_name: bd-dev
    ports:
      - "4003:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - datos-dev:/var/lib/postgresql/data
    networks:
      - red-dev

networks:
  red-dev:
    name: red-dev

volumes:
  datos-dev:
    name: datos-dev
